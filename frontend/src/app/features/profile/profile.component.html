<div class="min-h-screen bg-gray-50 p-6 flex justify-center">
  <div class="w-full max-w-3xl">

    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">My Profile</h2>

    <!-- Error -->
    @if (errorMessage()) {
      <div class="p-4 bg-red-50 border border-red-200 rounded-lg mb-6 text-red-700 text-center">
        {{ errorMessage() }}
      </div>
    }

    <!-- Success -->
    @if (successMessage()) {
      <div class="p-4 bg-green-50 border border-green-200 rounded-lg mb-6 text-green-700 text-center">
        {{ successMessage() }}
      </div>
    }

    <!-- Loading -->
    @if (loading()) {
      <div class="p-10 flex items-center justify-center">
        <svg class="animate-spin h-10 w-10 text-blue-600" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10"
            stroke="currentColor" stroke-width="4" fill="none"></circle>
          <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.3 0 0 5.3 0 12h4z"/>
        </svg>
      </div>
    }

    @if (!loading() && user()) {

      <!-- PROFILE INFO -->
      <div class="bg-white rounded-xl shadow p-8 mb-10">
        <h3 class="text-lg font-bold text-gray-800 mb-6 text-center">Account Information</h3>

        <form [formGroup]="profileForm" (ngSubmit)="updateProfile()" class="space-y-5">

          <div class="flex flex-col items-center">
            <label class="block text-sm font-medium mb-1 w-full max-w-md">Full Name</label>
            <input 
              formControlName="fullName"
              class="w-full max-w-md px-4 py-3 border rounded-lg bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500" 
            />
          </div>

          <div class="flex flex-col items-center">
            <label class="block text-sm font-medium mb-1 w-full max-w-md">Email</label>
            <input 
              formControlName="email"
              class="w-full max-w-md px-4 py-3 border rounded-lg bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500" 
            />
          </div>

          <div class="flex flex-col items-center">
            <p class="text-sm text-gray-500 w-full max-w-md">Role</p>
            <span class="mr-96 px-3 py-1 text-xs rounded-full bg-blue-100 text-blue-800">
              {{ user()?.role }}
            </span>
          </div>

          <!-- Update Button -->
          <div class="flex justify-center pt-3">
            <button type="submit"
              [disabled]="savingProfile()"
              class="bg-blue-600 text-white py-3 px-6 rounded-lg hover:bg-blue-700 w-48">
              @if (savingProfile()) { Updating... } @else { Update Profile }
            </button>
          </div>

        </form>
      </div>

      <!-- CHANGE PASSWORD -->
      <div class="bg-white rounded-xl shadow p-8">
        <h3 class="text-lg font-bold text-gray-800 mb-6 text-center">Change Password</h3>

        <form [formGroup]="passwordForm" (ngSubmit)="changePassword()" class="space-y-5">

          <div class="flex flex-col items-center">
            <label class="block text-sm font-medium mb-1 w-full max-w-md">Current Password</label>
            <input type="password"
              formControlName="currentPassword"
              class="w-full max-w-md px-4 py-3 border rounded-lg bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500" />
          </div>

          <div class="flex flex-col items-center">
            <label class="block text-sm font-medium mb-1 w-full max-w-md">New Password</label>
            <input type="password"
              formControlName="newPassword"
              class="w-full max-w-md px-4 py-3 border rounded-lg bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500" />
          </div>

          <div class="flex flex-col items-center">
            <label class="block text-sm font-medium mb-1 w-full max-w-md">Confirm New Password</label>
            <input type="password"
              formControlName="confirmNewPassword"
              class="w-full max-w-md px-4 py-3 border rounded-lg bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500" />
          </div>

          <div class="flex justify-center pt-3">
            <button type="submit"
              [disabled]="savingPassword()"
              class="bg-green-600 text-white py-3 px-6 rounded-lg hover:bg-green-700 w-48">
              @if (savingPassword()) { Updating... } @else { Change Password }
            </button>
          </div>

        </form>
      </div>
    }
  </div>
</div>
