<div class="min-h-screen flex items-center justify-center bg-gray-50 p-6">

  @if (loading()) {
    <div class="text-center">
      <div class="animate-spin h-10 w-10 border-4 border-blue-500 border-t-transparent rounded-full"></div>
      <p class="mt-4 text-gray-600">Verifying your email...</p>
    </div>
  }

  @if (verified()) {
    <div class="bg-white p-8 rounded-xl shadow text-center max-w-md">
      <h2 class="text-2xl font-bold text-green-600 mb-2">Verification Successful</h2>
      <p class="text-gray-700">{{ message() }}</p>
    </div>
  }

  @if (errorMessage()) {
    <div class="bg-red-50 p-8 rounded-xl shadow text-center max-w-md">
      <h2 class="text-2xl font-bold text-red-600 mb-2">Verification Failed</h2>
      <p class="text-red-700">{{ errorMessage() }}</p>
    </div>
  }

</div>
