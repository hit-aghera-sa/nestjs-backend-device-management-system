<div class="min-h-screen bg-gray-50 p-6">

  <!-- Back Button -->
  <button
    (click)="goBack()"
    class="mb-6 inline-flex items-center gap-2 text-gray-700 hover:text-gray-900"
  >
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 19l-7-7 7-7" />
    </svg>
    Back to Admin List
  </button>

  <!-- Error -->
  @if (errorMessage()) {
    <div class="p-4 bg-red-50 border border-red-200 rounded-lg mb-6">
      <p class="text-red-700">{{ errorMessage() }}</p>
    </div>
  }

  <!-- Loading -->
  @if (loading()) {
    <div class="p-10 flex items-center justify-center">
      <svg class="animate-spin h-10 w-10 text-blue-600" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10"
                stroke="currentColor" stroke-width="4" fill="none"></circle>
        <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.3 0 0 5.3 0 12h4z"/>
      </svg>
    </div>
  }

  <!-- Edit Form -->
  @if (!loading() && admin()) {
    <div class="bg-white rounded-xl shadow p-6 max-w-xl mx-auto">

      <h2 class="text-2xl font-bold text-gray-800 mb-6">
        Edit Admin – {{ admin()?.fullName }}
      </h2>

      <form [formGroup]="adminForm" (ngSubmit)="submit()" class="space-y-5">

        <!-- Full Name -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Full Name *</label>
          <input
            formControlName="fullName"
            class="w-full px-4 py-3 border rounded-lg bg-gray-50 focus:bg-white 
                   focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder="John Doe"
          >
        </div>

        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
          <input
            formControlName="email"
            class="w-full px-4 py-3 border rounded-lg bg-gray-50 focus:bg-white 
                   focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder="admin@company.com"
          >
        </div>

        <!-- Role -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Role *</label>
          <select
            formControlName="role"
            class="w-full px-4 py-3 border rounded-lg bg-gray-50 focus:bg-white 
                   focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          >
            @for (role of roles; track role.value) {
              <option [value]="role.value">{{ role.label }}</option>
            }
          </select>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          [disabled]="saving() || adminForm.invalid"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg 
                 transition-colors"
        >
          @if (saving()) {
            Saving...
          } @else {
            Save Changes
          }
        </button>

      </form>

    </div>
  }

</div>
