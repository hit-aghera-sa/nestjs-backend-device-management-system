<aside class="w-64 bg-gradient-to-b from-white to-gray-50 border-r border-gray-200 shadow-lg flex flex-col h-screen">

  <!-- Logo Section -->
  <div class="p-6 border-b border-gray-100">
    <a routerLink="/dashboard"
       class="flex items-center space-x-3 group">
      <div class="w-10 h-10 bg-gradient-to-r from-blue-500 to-indigo-600 rounded-xl flex items-center justify-center shadow-md group-hover:shadow-lg transition-shadow">
        <span class="text-white font-bold text-lg">D</span>
      </div>
      <div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">
          DIM
        </h1>
        <p class="text-xs text-gray-400 mt-0.5">Device Inventory Manager</p>
      </div>
    </a>
  </div>

  <!-- Navigation Menu -->
  <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
    <div class="px-3 py-2">
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">
        Main Menu
      </p>
      
      <a routerLink="/dashboard" routerLinkActive="active" 
         class="menu-item group">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        <span>Dashboard</span>
      </a>

      <a routerLink="/employees" routerLinkActive="active" 
         class="menu-item group">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z"/>
        </svg>
        <span>Employees</span>
      </a>

      <a routerLink="/devices" routerLinkActive="active" 
         class="menu-item group">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
        <span>Devices</span>
      </a>

      <a routerLink="/assignments" routerLinkActive="active" 
         class="menu-item group">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>Assignments</span>
      </a>

      <a routerLink="/stock" routerLinkActive="active" 
         class="menu-item group">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
        </svg>
        <span>Stock</span>
      </a>

      <!-- Admin Section -->
      <div *ngIf="isMaster()" class="mt-6">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3 px-3">
          Administration
        </p>
        
        <a routerLink="/admin-management" routerLinkActive="active" 
           class="menu-item group">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          <span>Admin Management</span>
        </a>
      </div>
    </div>

    <!-- User Section -->
    <div class="mt-6">
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3 px-3">
        Account
      </p>
      
      <a routerLink="/profile" routerLinkActive="active" 
         class="menu-item group">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        <span>Profile</span>
        <span *ngIf="user()" class="ml-auto text-xs px-2 py-1 bg-gray-100 text-gray-600 rounded-full">
          {{ user().role }}
        </span>
      </a>
    </div>
  </nav>

  <!-- Logout Section -->
  <!-- Logout Section -->
<div class="p-4 border-t border-gray-100 bg-gradient-to-r from-gray-50 to-white/50">
  <div class="flex items-center justify-between px-2 mb-4">
    <div>
      <p class="font-medium text-gray-900">{{ user()?.name || 'User' }}</p>
      <p class="text-sm text-gray-500">{{ user()?.email || 'user@example.com' }}</p>
    </div>
    <div class="w-10 h-10 bg-gradient-to-r from-blue-500 to-indigo-600 rounded-full flex items-center justify-center text-white font-semibold text-sm shadow-md">
      {{ (user()?.name || 'U').charAt(0) }}
    </div>
  </div>
  
  <button (click)="logout()"
         class="logout-btn glass group relative overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-r from-red-500 via-red-600 to-red-500 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
    <div class="relative z-10 flex items-center justify-center gap-3">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
      <span class="font-medium">Logout</span>
    </div>
    
    <!-- Animated border effect -->
    <div class="absolute inset-0 border-2 border-transparent group-hover:border-red-200/30 rounded-xl transition-all duration-300"></div>
  </button>
</div>

</aside>
