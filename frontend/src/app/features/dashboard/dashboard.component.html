<!-- src/app/features/dashboard/dashboard.component.html -->

<div class="min-h-screen bg-gray-100 p-6">

  <!-- Page Header -->
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Dashboard Overview</h1>
    <p class="text-gray-600">Welcome back, {{ user()?.fullName }}</p>
  </div>

  <!-- Dashboard Stats Cards -->
  <div class="grid gap-6 grid-cols-1 md:grid-cols-3 mb-10">

    <!-- Total Devices -->
    <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm hover:shadow-md transition">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-sm text-gray-500 mb-1">Total Devices</p>
          <h3 class="text-2xl font-bold text-gray-800">{{ stats()?.totalDevices ?? 0 }}</h3>
        </div>
        <div class="w-12 h-12 bg-blue-50 rounded-lg flex items-center justify-center">
          <span class="text-blue-600 text-xl">📱</span>
        </div>
      </div>
    </div>

    <!-- Assigned Devices -->
    <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm hover:shadow-md transition">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-sm text-gray-500 mb-1">Assigned</p>
          <h3 class="text-2xl font-bold text-gray-800">{{ stats()?.assignedDevices ?? 0 }}</h3>
        </div>
        <div class="w-12 h-12 bg-green-50 rounded-lg flex items-center justify-center">
          <span class="text-green-600 text-xl">✓</span>
        </div>
      </div>
    </div>

    <!-- Available -->
    <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm hover:shadow-md transition">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-sm text-gray-500 mb-1">Available</p>
          <h3 class="text-2xl font-bold text-gray-800">{{ stats()?.availableDevices ?? 0 }}</h3>
        </div>
        <div class="w-12 h-12 bg-amber-50 rounded-lg flex items-center justify-center">
          <span class="text-amber-600 text-xl">📦</span>
        </div>
      </div>
    </div>

  </div>

  <!-- NAVIGATION GRID (REPLACES SIDEBAR + QUICK ACTIONS) -->
  <div class="grid gap-6 grid-cols-1 md:grid-cols-3">

    <!-- Employees -->
    <button (click)="go('/employees')"
      class="dashboard-tile">
      <span class="text-3xl">👥</span>
      <h3>Employees</h3>
      <p>Manage employees, verification & details</p>
    </button>

    <!-- Devices -->
    <button (click)="go('/devices')"
      class="dashboard-tile">
      <span class="text-3xl">💻</span>
      <h3>Devices</h3>
      <p>View, add, and maintain device inventory</p>
    </button>

    <!-- Assignments -->
    <button (click)="go('/assignments')"
      class="dashboard-tile">
      <span class="text-3xl">📄</span>
      <h3>Assignments</h3>
      <p>Assign or return devices for employees</p>
    </button>

    <!-- Stock -->
    <button (click)="go('/stock')"
      class="dashboard-tile">
      <span class="text-3xl">📦</span>
      <h3>Stock</h3>
      <p>Device stock levels and low-stock alerts</p>
    </button>

    <!-- Profile -->
    <button (click)="goToProfile()"
      class="dashboard-tile">
      <span class="text-3xl">👤</span>
      <h3>Admin Profile</h3>
      <p>Update your details and password</p>
    </button>

    <!-- Admin Management -->
    @if (user()?.role === 'MASTER') {
      <button (click)="go('/admin-management')" class="dashboard-tile">
        <span class="text-3xl">🛠️</span>
        <h3>Admin Management</h3>
        <p>Manage admin users & permissions</p>
      </button>
    }

  </div>

</div>
